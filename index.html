<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片编辑</title>
    <style>
        /* ===== 极简配色 + 动画增强 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #2b7be4;
            --primary-dark: #1f5fa8;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-tertiary: #888888;
            --border: #e0e0e0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        body {
            font-family: -apple-system, "Microsoft YaHei", Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* 标题入场 + 加粗（font-weight: 700） */
        h1 {
            text-align: center;
            font-weight: 700;          /* 从 500 改为 700，加粗 */
            font-size: 28px;
            color: var(--text-primary);
            margin: 20px 0 30px;
            letter-spacing: 0.3px;
            animation: fadeDown 0.8s ease forwards;
        }
        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #fafafa;
            transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
            margin-bottom: 30px;
            position: relative;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background-color: #f0f6ff;
            box-shadow: 0 0 0 4px rgba(43, 123, 228, 0.08);
        }
        /* 拖拽时的脉冲动画 */
        .upload-area.drag-over {
            border-color: var(--primary);
            background-color: #e6f0ff;
            animation: pulse-border 0.8s ease infinite alternate;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(43, 123, 228, 0.2); }
            100% { box-shadow: 0 0 0 8px rgba(43, 123, 228, 0); }
        }
        .upload-area p {
            color: var(--text-secondary);
            font-size: 17px;
            margin-bottom: 6px;
        }
        .upload-area small {
            color: var(--text-tertiary);
            font-size: 13px;
        }
        #fileInput {
            display: none;
        }

        /* 预览容器 — 使用 visibility + opacity 实现平滑入场 */
        .preview-container {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: visibility 0s 0.4s, opacity 0.5s ease, transform 0.5s ease;
            /* 延迟 visibility 隐藏，以便退场动画 */
        }
        .preview-container.active {
            visibility: visible;
            opacity: 1;
            transform: translateY(0);
            transition: visibility 0s 0s, opacity 0.5s ease, transform 0.5s ease;
        }

        /* 卡片 — 每个卡片独立延迟入场 */
        .preview-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px 24px 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .preview-container.active .preview-card {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease;
        }
        .preview-container.active .preview-card:nth-child(1) {
            transition-delay: 0.1s;
        }
        .preview-container.active .preview-card:nth-child(2) {
            transition-delay: 0.25s;
        }
        .preview-card:hover {
            transform: translateY(-6px) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        @media (min-width: 768px) {
            .preview-card {
                width: calc(50% - 12px);
            }
        }

        .preview-card h3 {
            text-align: center;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
            width: auto;
            padding-left: 6px;
            padding-right: 6px;
            letter-spacing: 0.5px;
        }

        canvas {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 18px;
            display: block;
            background: #f0f0f0;
            border: 1px solid #eee;
        }

        /* 按钮 — 点击缩放反馈 */
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.25s, transform 0.15s, box-shadow 0.25s;
            transform: scale(1);
        }
        button:hover {
            background-color: var(--primary-dark);
            box-shadow: 0 2px 10px rgba(43, 123, 228, 0.25);
        }
        button:active {
            transform: scale(0.96);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1) !important;
        }

        /* 加载状态 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 12px;
            border: 3px solid #e0e0e0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>图片效果生成工具</h1>

    <div class="upload-area" id="uploadArea">
        <p>📤 拖拽或点击上传图片</p>
        <small>支持 JPG / PNG 等常见格式</small>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>正在处理，请稍候…</p>
    </div>

    <div class="preview-container" id="previewContainer">
        <!-- 毛玻璃 -->
        <div class="preview-card">
            <h3>毛玻璃效果</h3>
            <canvas id="blurCanvas"></canvas>
            <button id="downloadBlur">下载毛玻璃图片</button>
        </div>
        <!-- 渐变背景 -->
        <div class="preview-card">
            <h3>渐变背景效果</h3>
            <canvas id="gradientCanvas"></canvas>
            <button id="downloadGradient">下载渐变背景图片</button>
        </div>
    </div>

    <script>
        // ---------- DOM 引用 ----------
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const blurCanvas = document.getElementById('blurCanvas');
        const gradientCanvas = document.getElementById('gradientCanvas');
        const downloadBlur = document.getElementById('downloadBlur');
        const downloadGradient = document.getElementById('downloadGradient');
        const loading = document.getElementById('loading');

        const blurCtx = blurCanvas.getContext('2d');
        const gradientCtx = gradientCanvas.getContext('2d');

        // ---------- 上传事件（带拖拽脉冲动画） ----------
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // ---------- 核心处理 ----------
        function handleFile(file) {
            loading.classList.add('active');
            previewContainer.classList.remove('active'); // 隐藏之前的预览

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    // 模拟处理延迟（实际可去掉）
                    setTimeout(() => {
                        const cropped = cropTo16x9(img);
                        generateBlurEffect(cropped);
                        const mainColor = extractMainColor(cropped);
                        generateGradientEffect(mainColor);
                        loading.classList.remove('active');
                        previewContainer.classList.add('active'); // 触发卡片入场动画
                    }, 600);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 裁切为 16:9
        function cropTo16x9(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const ratio = 16 / 9;
            const imgRatio = img.width / img.height;
            let cropW, cropH, x, y;
            if (imgRatio > ratio) {
                cropH = img.height;
                cropW = img.height * ratio;
                x = (img.width - cropW) / 2;
                y = 0;
            } else {
                cropW = img.width;
                cropH = img.width / ratio;
                x = 0;
                y = (img.height - cropH) / 2;
            }
            canvas.width = cropW;
            canvas.height = cropH;
            ctx.drawImage(img, x, y, cropW, cropH, 0, 0, cropW, cropH);
            return canvas;
        }

        // 毛玻璃效果（渐进模糊动画）
        function generateBlurEffect(croppedCanvas) {
            const containerWidth = previewContainer.offsetWidth || 500;
            const isMobile = window.innerWidth < 768;
            const targetWidth = isMobile ? containerWidth * 0.9 : 500;
            const targetHeight = targetWidth * 9 / 16;

            blurCanvas.width = targetWidth;
            blurCanvas.height = targetHeight;

            let blur = 0;
            const step = 0.6;
            const maxBlur = 18;

            function drawBlur() {
                blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);
                blurCtx.filter = `blur(${blur}px) brightness(0.7) contrast(1.1)`;
                blurCtx.drawImage(croppedCanvas, 0, 0, blurCanvas.width, blurCanvas.height);
                blurCtx.filter = 'none';
                if (blur < maxBlur) {
                    blur = Math.min(blur + step, maxBlur);
                    requestAnimationFrame(drawBlur);
                }
            }
            drawBlur();
        }

        // 提取主色调（中心区域平均）
        function extractMainColor(canvas) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const areaW = w * 0.3, areaH = h * 0.3;
            const x = (w - areaW) / 2, y = (h - areaH) / 2;
            const imageData = ctx.getImageData(x, y, areaW, areaH);
            const data = imageData.data;
            let r = 0, g = 0, b = 0;
            const count = data.length / 4;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i];
                g += data[i+1];
                b += data[i+2];
            }
            return `rgb(${Math.round(r/count)}, ${Math.round(g/count)}, ${Math.round(b/count)})`;
        }

        // 渐变背景效果（自下而上）
        function generateGradientEffect(mainColor) {
            const containerWidth = previewContainer.offsetWidth || 500;
            const isMobile = window.innerWidth < 768;
            const width = isMobile ? containerWidth * 0.9 : 500;
            const height = width * 9 / 16;

            gradientCanvas.width = width;
            gradientCanvas.height = height;

            const grad = gradientCtx.createLinearGradient(0, height, 0, 0);
            grad.addColorStop(0, mainColor);
            grad.addColorStop(1, adjustColor(mainColor, -0.6));

            let progress = 0;
            function drawGrad() {
                gradientCtx.clearRect(0, 0, width, height);
                gradientCtx.fillStyle = grad;
                gradientCtx.fillRect(0, height - height * progress, width, height * progress);
                if (progress < 1) {
                    progress = Math.min(progress + 0.025, 1);
                    requestAnimationFrame(drawGrad);
                }
            }
            drawGrad();
        }

        // 颜色变暗
        function adjustColor(color, factor) {
            const rgb = color.match(/\d+/g).map(Number);
            return `rgb(${Math.max(0, Math.round(rgb[0] * (1 + factor)))},
                        ${Math.max(0, Math.round(rgb[1] * (1 + factor)))},
                        ${Math.max(0, Math.round(rgb[2] * (1 + factor)))})`;
        }

        // ---------- 下载（带按钮禁用和文字反馈） ----------
        function downloadCanvas(canvas, filename) {
            const btn = filename.includes('毛玻璃') ? downloadBlur : downloadGradient;
            btn.textContent = '下载中…';
            btn.disabled = true;
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setTimeout(() => {
                    btn.textContent = filename.includes('毛玻璃') ? '下载毛玻璃图片' : '下载渐变背景图片';
                    btn.disabled = false;
                }, 800);
            }, 'image/png');
        }

        downloadBlur.addEventListener('click', () => downloadCanvas(blurCanvas, '毛玻璃效果.png'));
        downloadGradient.addEventListener('click', () => downloadCanvas(gradientCanvas, '渐变背景效果.png'));
    </script>
</body>
</html>
